  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>


  <section id="welcome-section">
    <div class="container">
      <h1>Hello!👋 Welcome To</h1>
      <div class="flex">
        <div class="emoji-class">🔥</div>
        <h2>TimeSkip</h2>
        <div class="emoji-class">⚡</div>
      </div>
      <h3>Your Go-to Anime Inspired Todo List app</h3>
      <h4>Where will you be after the training arc?</h4>
      <h5>Ready to start?</h5>
      <div id="button-container">


        <a class="scroll-arrow" href="#task-section"><i class="fa fa-arrow-down"></i></a>
      </div>
      <div id="todo-list-container">
        <ul class="list-item"></ul>
      </div>
    </div>

  </section>

  <section>
  </section>

  <section>
  </section>

  <section>
  </section>

  <section>
  </section>



  <section id="task-section">
    <div class="top-bar">
      <div class="search-box-area">
        <span class="search-box-icon">
        <input type="search" id="search-bar" placeholder="Search here..." name="search" size="70">
          </span>
      </div>
      <div class="btn-box-area">
        <button class="addTaskBtn" type="button"><i class="fa fa-plus"></i> Add Task</button>
      </div>
    </div>
      </section>

      <dialog id="addTaskModal" class="modal">
          <form method="dialog">
            <div class="modal-header">
              <h3 class="modal-title">Add Task</h3>
              <span><i class="fa fa-times fa-lg close-modal-btn"></i></span>
            </div>
            <div class="modal-content">
              <label for="task-name">Task Name</label>
              <input class= "input-spacing" type="text" name="task-name" id="task-name" placeholder="Enter Task Name...">
              <label for="task-details">Task Details</label>
              <textarea class= "input-spacing" name="task-details" id="task-details" rows="10" cols="25" placeholder="Enter Task Details..."></textarea>
              <p>Set Task Difficulty:</p>
              <div class="radio-group">
                <label for="easy" class="easy">Easy</label>
                <input type="radio" name="difficulty-setting" id="easy" value="easy">
                <label for="medium" class="medium">Medium</label>
                <input type="radio" name="difficulty-setting" id="medium" value="medium">
                <label for="hard" class="hard">Hard</label>
                <input type="radio" name="difficulty-setting" id="hard" value="hard">
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-footer-btn" type="button">Cancel</button>
              <button class="modal-footer-btn" type="button">Submit</button>
            </div>
          </form>

      </dialog>
      <script src="js/script.js"></script>

    </body>

    </html>
