<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeSkip</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>


  <main>
    <div id="container">
      <h1>Hello!👋 Welcome To</h1>
      <h2>🔥TimeSkip⚡</h2>
      <h3>Your Go-to Anime Inspired Todo List app</h3>
      <h4>Where will you be after the training arc?</h4>
      <div id="button-container">
        <button class="addTaskBtn" type="button"><i class="fa fa-plus"></i> Add Task</button>
      </div>
      <div id="todo-list-container">
        <ul class="list-item"></ul>
      </div>
    </div>

  </main>

  <dialog id="addTaskModal" class="modal">
      <form method="dialog">
        <div class="modal-header">
          <h3 class="modal-title">Add Task</h3>
        </div>
        <div class="modal-content">
          <label for="new-task-name">Task Name:</label>
          <input class= "input-spacing" type="text" name="task-name" id="new-task-name">
          <label for="new-task-details">Task Details:</label>
          <textarea class= "input-spacing" name="task-details" id="new-task-details" rows="4" cols="25"></textarea>
          <label for="new-task-difficulty">Task Difficulty:</label>
          <input class= "input-spacing" type="range" name="new-task-difficulty" id="new-task-difficulty" min="1" max="5" value="3" list="values">
          <datalist id="values">
            <option value="1" label="1"></option>
            <option value="2" label="2"></option>
            <option value="3" label="3"></option>
            <option value="4" label="4"></option>
            <option value="5" label="5"></option>
          </datalist>
        </div>
        <div class="modal-footer">
          <button class="modal-footer-btn" type="button">Cancel</button>
          <button class="modal-footer-btn" type="button">Submit</button>
        </div>
      </form>

  </dialog>
  <script src="js/script.js"></script>

</body>

</html>
